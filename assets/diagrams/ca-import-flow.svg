height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Select the store scope</b><br /><code>004DA9AD  cmp [ebp+0x14], 0</code><br />// Compares the caller's scope argument with zero.<br /><code>004DA9B1  jne 0x4DA9C1</code><br />// Branches to the other scope path when it is nonzero.<br /><code>004DA9B3  mov [ebp-0x58], 0x20</code><br />// Sets the provider flags to 0x20.<br /><code>004DA9BA  mov [ebp-0x50], 0x20000</code><br />// Selects CERT_SYSTEM_STORE_LOCAL_MACHINE.</p></span></div></foreignObject></g></g><g class="node default block" id="my-svg-flowchart-B-1" data-look="neo" transform="translate(249.5546875, 572)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important" x="-211.671875" y="-216" width="423.34375" height="432"/><g class="label" style="color:#111111 !important" transform="translate(-195.671875, -204)"><rect/><foreignObject width="391.34375" height="408"><div style="color: rgb(17, 17, 17) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Open LocalMachine Root</b><br /><code>004DA9E8  lea eax, [ebp-0x44]</code><br />// Loads the address of the converted Root store name.<br /><code>004DA9EB  push eax</code><br />// Pushes the store name.<br /><code>004DA9EC  mov ecx, [ebp-0x50]</code><br />// Reloads the LocalMachine scope flags.<br /><code>004DA9EF  push ecx</code><br />// Pushes the scope flags.<br /><code>004DA9F0  push 0</code><br />// Passes a null provider parameter.<br /><code>004DA9F2  push 0x10001</code><br />// Selects X509 and PKCS_7 ASN encodings.<br /><code>004DA9F7  push 0xA</code><br />// Selects CERT_STORE_PROV_SYSTEM_W.<br /><code>004DA9F9  call CertOpenStore</code><br />// Opens the LocalMachine Root store.</p></span></div></foreignObject></g></g><g class="node default block" id="my-svg-flowchart-C-2" data-look="neo" transform="translate(249.5546875, 1116)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important" x="-237.5546875" y="-288" width="475.109375" height="576"/><g class="label" style="color:#111111 !important" transform="translate(-221.5546875, -276)"><rect/><foreignObject width="443.109375" height="552"><div style="color: rgb(17, 17, 17) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Add the encoded certificate</b><br /><code>004DAA0A  lea edx, [ebp-0x4C]</code><br />// Computes the output cert-context slot.<br /><code>004DAA0D  push edx</code><br />// Pushes the cert-context output pointer.<br /><code>004DAA0E  push 2</code><br />// Uses CERT_STORE_ADD_USE_EXISTING.<br /><code>004DAA10  mov eax, [ebp+0xC]</code><br />// Loads the certificate length.<br /><code>004DAA13  push eax</code><br />// Pushes the certificate length.<br /><code>004DAA14  mov ecx, [ebp+8]</code><br />// Loads the certificate byte pointer.<br /><code>004DAA17  push ecx</code><br />// Pushes the certificate bytes.<br /><code>004DAA18  push 1</code><br />// Selects X509_ASN_ENCODING.<br /><code>004DAA1A  mov edx, [ebp-0x48]</code><br />// Loads the open store handle.<br /><code>004DAA1D  push edx</code><br />// Pushes the store handle.<br /><code>004DAA1E  call CertAddEncodedCertificateToStore</code><br />// Adds the CA to the machine Root store.</p></span></div></foreignObject></g></g><g class="node default fail" id="my-svg-flowchart-OTHER-3" data-look="neo" transform="translate(596.8203125, 392)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important;stroke-dasharray:2 2 !important" x="-95.59375" y="-36" width="191.1875" height="72"/><g class="label" style="color:#111111 !important" transform="translate(-79.59375, -24)"><rect/><foreignObject width="159.1875" height="48"><div style="color: rgb(17, 17, 17) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Other store scope</b><br />// Outside this excerpt.</p></span></div></foreignObject></g></g><g class="node default endnode" id="my-svg-flowchart-TRUST-4" data-look="neo" transform="translate(249.5546875, 1480)"><rect class="basic label-container" style="fill:#111111 !important;stroke:#111111 !important;stroke-width:1.5px !important" x="-129.8125" y="-36" width="259.625" height="72"/><g class="label" style="color:#ffffff !important" transform="translate(-113.8125, -24)"><rect/><foreignObject width="227.625" height="48"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffffff !important" class="nodeLabel"><p><b>Machine trust anchor</b><br />// Persists after service removal.</p></span></div></foreignObject></g></g></g></g><marker id="my-svg_flowchart-v2-pointEnd-margin__111111" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;" stroke="#111111" fill="#111111"/></marker></g></svg>