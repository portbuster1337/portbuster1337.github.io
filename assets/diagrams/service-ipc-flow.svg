idth: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Create the UI mutex</b><br /><code>004524D2  push 0x829270</code><br />// Pushes the Global\HttpDebuggerUiStarted name.<br /><code>004524D7  push 0</code><br />// Sets the initial owner to false.<br /><code>004524D9  push [ebp-0xAC]</code><br />// Pushes the security attributes pointer.<br /><code>004524E2  call dword ptr [0x74F1D8]</code><br />// Calls CreateMutexA to create the UI-present mutex.<br /><code>004524E8  mov [esi+0x0C], eax</code><br />// Stores the mutex handle in the service object.<br /><code>004524EB  test eax, eax</code><br />// Checks whether creation succeeded.<br /><code>004524ED  je loc_45295B</code><br />// Branches to the failure path on a null handle.</p></span></div></foreignObject></g></g><g class="node default block" id="my-svg-flowchart-B-1" data-look="neo" transform="translate(249.015625, 704)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important" x="-216.984375" y="-204" width="433.96875" height="408"/><g class="label" style="color:#111111 !important" transform="translate(-200.984375, -192)"><rect/><foreignObject width="401.96875" height="384"><div style="color: rgb(17, 17, 17) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Create the Settings channel</b><br /><code>004524F3  push 0x1E</code><br />// Pushes the maximum name length.<br /><code>004524F5  push 0x829290</code><br />// Pushes the Global\HttpDebuggerIpcSettings name.<br />// Intermediate argument setup omitted from this excerpt.<br /><code>00452538  push ebx</code><br />// Pushes the channel flags.<br /><code>00452539  push ecx</code><br />// Pushes the security attributes.<br /><code>0045253A  push eax</code><br />// Pushes the object name.<br /><code>0045253B  lea ecx, [esi+0x20]</code><br />// Points ECX at the Settings channel object.<br /><code>0045253E  call sub_453B90</code><br />// Creates the Settings section channel.</p></span></div></foreignObject></g></g><g class="node default block" id="my-svg-flowchart-C-2" data-look="neo" transform="translate(249.015625, 1104)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important" x="-237.015625" y="-156" width="474.03125" height="312"/><g class="label" style="color:#111111 !important" transform="translate(-221.015625, -144)"><rect/><foreignObject width="442.03125" height="288"><div style="color: rgb(17, 17, 17) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 600px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#111111 !important" class="nodeLabel"><p><b>Create the command and transaction channels</b><br /><code>004525A6  push 0x8292D8</code><br />// Pushes the Global\HttpDebuggerIpcEngineCommand name.<br />// Command channel setup omitted from this excerpt.<br /><code>0045268A  push 0x82934C</code><br />// Pushes the Global\HttpDebuggerIpcHttpTransaction name.<br /><code>004526C1  push 0x80</code><br />// Sets the transaction ring capacity to 128 slots.<br /><code>004526C8  lea ecx, [esi+0x480]</code><br />// Points ECX at the transaction channel object.<br /><code>004526CE  call sub_453B90</code><br />// Creates the transaction channel.</p></span></div></foreignObject></g></g><g class="node default fail" id="my-svg-flowchart-FAIL-3" data-look="neo" transform="translate(644.2890625, 536)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#111111 !important;stroke-width:1.5px !important;stroke-dasharray:2 2 !important" x="-138.2890625" y="-36" width="276.578125" height="72"/><g class="label" style="color:#111111 !important" transform="translate(-122.2890625, -24)"><rec